<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1115" />
    <title>Sign in · VT&amp;AAS</title>
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <main class="auth-layout">
      <section class="brand-panel" aria-label="VT&AAS">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M4 22.5h4.2l2-7.6a1.7 1.7 0 0 1 1.7-1.3h8.3a1.7 1.7 0 0 1 1.6 1.2l2.1 7.7H28M8.2 22.5v3M24 22.5v3M11.4 18.8h9.2M8.9 11.3l2.8-3.8h8.7l2.8 3.8" /></svg></div>
        <div class="brand-name">VT&amp;AAS</div>
        <div class="brand-subtitle">VEHICLE TRACKING &amp; ACCIDENT ALERT SYSTEM</div>
        <div class="brand-rule"></div>
        <p>Stay informed. Respond faster.</p>
        <span class="brand-caption">ESP32 VEHICLE SAFETY DASHBOARD</span>
      </section>

      <section class="auth-panel">
        <div class="auth-heading"><span class="eyebrow">DASHBOARD ACCESS</span><h1 id="form-title">Welcome back</h1><p id="form-subtitle">Sign in to view vehicle status and incident records.</p></div>
        <div class="auth-tabs" role="tablist" aria-label="Account access">
          <button id="login-tab" class="auth-tab active" type="button" role="tab" aria-selected="true">Sign in</button>
          <button id="register-tab" class="auth-tab" type="button" role="tab" aria-selected="false">Create account</button>
        </div>
        <form id="auth-form" novalidate>
          <label class="field hidden" id="name-field"><span>FULL NAME</span><input id="name" name="name" type="text" autocomplete="name" minlength="2" maxlength="60" placeholder="Your name" /></label>
          <label class="field"><span>EMAIL ADDRESS</span><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="you@example.com" /></label>
          <label class="field"><span>PASSWORD</span><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required placeholder="At least 8 characters" /></label>
          <label class="field hidden" id="confirm-field"><span>CONFIRM PASSWORD</span><input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Enter the password again" /></label>
          <div class="auth-error" id="auth-error" role="alert" aria-live="polite"></div>
          <button class="submit-button" id="submit-button" type="submit">Sign in</button>
        </form>
        <div class="auth-note"><span class="note-dot"></span><span id="auth-note">Use a unique password; this local prototype uses an unencrypted LAN connection.</span></div>
      </section>
    </main>
    <script src="firebase-config.js"></script>
    <script type="module" src="firebase-client.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
